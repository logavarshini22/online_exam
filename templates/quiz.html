<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 850px; margin: 35px auto; padding: 0 18px; background:#f4f7fb; color:#172033; }
    header, .question, .panel { background:white; border-radius:12px; padding:20px; margin:14px 0; box-shadow:0 2px 9px #00000012; }
    h1 { margin-bottom:5px; } .badge { display:inline-block; padding:5px 10px; border-radius:20px; background:#e3edff; color:#174ea6; font-size:13px; }
    label { display:block; margin:10px 0; } button { background:#175cd3; color:white; border:0; border-radius:8px; padding:12px 18px; cursor:pointer; font-size:16px; }
    .muted { color:#5b6474; } .score { font-size:22px; font-weight:bold; }
  </style>
</head>
<body>
<header>
  <span class="badge">{{ version }}</span>
  <h1>{{ title }}</h1>
  <p class="muted">{{ description }}</p>
  <p><strong>{{ questions|length }} multiple-choice questions</strong></p>
</header>
<form method="post" action="{{ url_for('submit') }}">
{% for q in questions %}
  <section class="question">
    <h3>{{ loop.index }}. {{ q.question }}</h3>
    {% for key, value in q.options.items() %}
      <label><input type="radio" name="{{ q.id }}" value="{{ key }}" required> {{ key }}. {{ value }}</label>
    {% endfor %}
  </section>
{% endfor %}
<button type="submit">Submit exam</button>
</form>
</body>
</html>
