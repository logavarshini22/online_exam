apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-exam-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: online-exam-v1
  template:
    metadata:
      labels:
        app: online-exam-v1
    spec:
      containers:
        - name: online-exam
          image: YOUR_DOCKERHUB_USERNAME/online-exam:v1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: online-exam-v1
spec:
  type: NodePort
  selector:
    app: online-exam-v1
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30051
